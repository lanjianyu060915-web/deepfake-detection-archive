line-length = 88

target-version = "py312"

preview = false

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".pytest_cache",
    "__pycache__",
    "temp",
    "archive",
    "external",
    "_vendor",
    "outputs",
    "cache",
    "tmp",
]

[lint]
select = [
    "E",    # pycodestyle errors: Python 标准错误检查 (如缩进错误)
    "W",    # pycodestyle warnings: Python 标准警告 (如无效的转义序列)
    "F",    # pyflakes: 逻辑错误检查 (最重要！如使用了未定义的变量、导入了未使用的模块)
    "I",    # isort: 导入排序 (自动把 import 按字母和类型排序)
    "N",    # pep8-naming: 命名规范 (如类名用 CamelCase，函数用 snake_case)
    "UP",   # pyupgrade: 代码现代化 (自动把旧语法升级，如把 "%s" % var 变成 f"{var}")
    "B",    # flake8-bugbear: 发现潜在的 bug (比 pyflakes 更深层，如在循环中修改列表)
    "SIM",  # flake8-simplify: 代码简化 (逻辑优化，如把 if not A: pass else: B 改为 if A: B)
    "C4",   # flake8-comprehensions: 推导式优化 (如用 list comprehension 替代 map/filter)
    "RUF",  # Ruff-specific rules: Ruff 自家独有的规则 (通常很快且很有用)
    "NPY",  # NumPy-specific rules: 如果你用 NumPy 做数据分析，这个很有用
    "PERF", # Perflint: 性能优化建议 (指在不改变逻辑的情况下，让代码跑得更快)
    "FURB", # Refurb: 代码翻新 (使用更现代、更 Pythonic 的写法)
    "LOG",  # flake8-logging: 日志检查 (确保 logging 库使用正确)
    "G",    # flake8-logging-format: 日志格式化检查 (建议在日志中使用延迟格式化)
    "ARG",  # flake8-unused-arguments: 未使用参数检查 (对库代码很有价值；测试里已放宽)
    "PT",   # flake8-pytest-style: 如果写测试，强制统一 pytest 风格
    "RET",  # flake8-return: 检查 return 语句 (如避免不必要的 else return)
    "PIE",  # flake8-pie: 杂项代码改进
    "T20",  # flake8-print: 禁止/提示使用 print (练习脚本目录已放宽)
    "A",    # flake8-builtins: 防止变量名覆盖 Python 内置函数 (如 id, list, type)
    "C90",  # mccabe: 显式启用圈复杂度检查
    "PTH",  # flake8-use-pathlib: 建议使用 pathlib 替代 os.path (更现代)
    "PL",   # Pylint: 包含 Refactor(PLR), Convention(PLC) 等大量严格规则
    "TRY",  # tryceratops: 异常处理的最佳实践 (如避免裸 try-except)
    "DTZ",  # flake8-datetimez: 强制使用带时区的 datetime (防止时间 bug)
    "TID",  # flake8-tidy-imports: 更好的导入管理 (如禁止相对导入)
    "D",    # pydocstyle: 文档格式检查 (Google 风格)
    "S",    # flake8-bandit: 安全检查 (如硬编码密码、SQL注入风险)
    "FAST", # FastAPI: 专门针对 FastAPI 路由、依赖注入和响应的错误检查。
    "PD",   # pandas-vet: 如果项目中还有 Pandas 代码，自动提示如 iterrows() 等低效的非向量化操作。
]

ignore = [
    "E501",    # 忽略 "Line too long"。原因：我们会用 Formatter 自动处理行长，不用 Linter 报错。
    "G004",    # 允许在 logging 中使用 f-string。
    "PLR2004", # [Pylint] 允许在比较中使用"魔术数"。算法练习中经常用 if x > 10，强制定义常量太繁琐。
    "TRY003",  # [Tryceratops] 允许在 raise 只包含长消息字符串的异常，不强制定义自定义异常类。
    "D1",      # [Pydocstyle] 忽略所有"缺少文档字符串"(Missing docstring)错误。我们只检查写的文档格式是否正确，不强制每行都写。

    "RUF001",
    "RUF002",
    "RUF003",

    "T201",
    "N806", # 允许在练习和脚本中使用 print 和全局变量（如常见的计数器 i）。
    "N803",
]

fixable = ["ALL"]
unfixable = []

[format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = true


[lint.isort]
combine-as-imports = true # 将 "from module import a, b" 合并在一行
lines-after-imports = 2   # 导入部分和正文代码之间空 2 行 (符合 PEP 8 推荐)

[lint.mccabe]
max-complexity = 15 # 如果一个函数的逻辑分支太复杂 (>15)，就报警提示你重构。

[lint.pydocstyle]
convention = "google" # 使用 Google 风格的文档字符串 (Args:, Returns: 等)

[lint.per-file-ignores]
"tests/*" = ["S101", "D", "PLR2004", "ARG"]
"**/tests/*" = ["S101", "D", "PLR2004", "ARG", "S404", "S603", "S607"]
"**/test_*.py" = ["S101", "D", "PLR2004", "ARG"]
"*_test.py" = ["S101", "D", "PLR2004", "ARG"]

"*.ipynb" = ["E402", "D", "PLR2004"] # Notebook 经常乱序导入
