[project]
name = "deepfake-detection-archive"
version = "0.1.1"
description = "Reproducible offline AIGC audio and video forgery detection competition project"
readme = "README.md"
authors = [
    { name = "maochuanjun", email = "10255501521@stu.ecnu.edu.cn" },
    { name = "lanjianyu060915-web", email = "lanjianyu060915@qq.com" },
]
requires-python = ">=3.12"
# The default AST package fixes these numerical frontend versions in release.json.
dependencies = ["numpy==2.5.3", "soundfile>=0.14,<0.15"]

[project.optional-dependencies]
cpu = [
    "torch==2.14.1+cpu",
    "torchvision==0.29.1+cpu",
    "torchaudio==2.11.0+cpu",
    "timm>=1.0.30,<1.1",
    "transformers==5.19.0",
]
cu126 = [
    "torch==2.14.1+cu126",
    "torchvision==0.29.1+cu126",
    "torchaudio==2.11.0+cu126",
    "timm>=1.0.30,<1.1",
    "transformers==5.19.0",
]

[project.scripts]
deepfake-detection-archive = "deepfake_detection_archive:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.12"]
research = ["pypdf>=5", "matplotlib>=3.10,<4", "ipykernel>=6,<8"]
media = [
    "scipy>=1.18.1,<1.19",
    "pandas>=3.0.6,<3.1",
    "scikit-learn>=1.9.1,<1.10",
    "librosa>=1.0,<1.1",
    "opencv-python-headless>=5.0.0.93,<5.1",
    "pillow>=12,<13",
    "imagehash>=4.3,<5",
    "pyyaml>=6,<7",
    "tqdm>=4,<5",
    "pyarrow>=26.0.0",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
# TorchAudio 2.11 uses stable ABI with Torch >=2.11.
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

# Ordinary packages use official PyPI; backend wheels use explicit official indexes.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["src/deepfake_detection_archive"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
strict = true
