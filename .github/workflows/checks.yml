name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          python-version: "3.12.15"
          enable-cache: true
      - name: CPU development dependencies
        run: >-
          uv sync --locked --no-install-project
          --group dev --group media --group research --extra cpu
      - name: Media decoder
        # BtbN retains month-end builds for two years; refresh before 2028-09.
        env:
          FFMPEG_RELEASE: autobuild-2026-09-30-13-08
          FFMPEG_ARCHIVE: ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_ARCHIVE" \
            --output "$RUNNER_TEMP/$FFMPEG_ARCHIVE"
          printf '%s  %s\n' "$FFMPEG_SHA256" "$RUNNER_TEMP/$FFMPEG_ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/$FFMPEG_ARCHIVE" --strip-components=1 -C "$RUNNER_TEMP/ffmpeg"
          printf '%s\n' "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Fixed EER reference
        run: |
          git init external/asvspoof2021
          git -C external/asvspoof2021 remote add origin https://github.com/asvspoof-challenge/2021
          git -C external/asvspoof2021 fetch --depth=1 origin 9b33f5eca887bd3bf629e3fb79428cd9bb7ac972
          git -C external/asvspoof2021 checkout --detach FETCH_HEAD
      - name: CPU environment probe
        run: >-
          uv run --no-sync python tools/check_environment.py
          --device cpu --output outputs/environment/ci.json
      - name: Project checks
        run: bash tools/check_project.sh
