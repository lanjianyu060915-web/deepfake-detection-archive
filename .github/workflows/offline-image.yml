name: offline runtime images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/release/**'
      - '.github/workflows/offline-image.yml'
      - 'containers/Dockerfile.offline'
      - 'tools/run_container_rehearsal.py'
      - 'tools/build_release.py'
      - 'tools/prepare_offline_package.py'
      - 'tools/build_media_tools.sh'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: offline-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cu126]
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      PYTHONPATH: ${{ github.workspace }}/src
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Space for isolated image build
        # Dedicated ephemeral runner only; never run this on the shared server.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc make nasm ffmpeg
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.0'
          python-version: '3.12.15'
          enable-cache: false
      - name: Locked runtime dependencies
        run: uv sync --locked --no-dev --group media --extra '${{ matrix.backend }}'
      - name: Published research weights for test mounts only
        run: |
          mkdir "$RUNNER_TEMP/download" "$RUNNER_TEMP/weights"
          gh release download v0.1.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'deepfake-v0.1.1-linux-x86_64.tar.gz.part-*' \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/download"
          (cd "$RUNNER_TEMP/download" && sha256sum --check SHA256SUMS)
          cat "$RUNNER_TEMP/download/"*.part-* | \
            tar -xz --wildcards --strip-components=2 -C "$RUNNER_TEMP/weights" '*/weights/*'
          rm -rf "$RUNNER_TEMP/download"
      - name: Fixed LGPL decoder with corresponding source
        run: |
          curl --fail --location --retry 3 \
            https://github.com/FFmpeg/FFmpeg/archive/ba987fe24d6713c4d4b3a15cebaeca18c41fbd31.tar.gz \
            --output "$RUNNER_TEMP/ffmpeg-source.tar.gz"
          bash tools/build_media_tools.sh "$RUNNER_TEMP/ffmpeg-source.tar.gz" "$RUNNER_TEMP/media-tools"
      - name: Build existing offline package
        run: |
          SITE="$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          PYTHON_HOME="$(uv python find 3.12.15 | xargs realpath | xargs dirname | xargs dirname)"
          uv run --no-sync python tools/build_release.py \
            --version '0.1.2-container-${{ matrix.backend }}' \
            --output "$RUNNER_TEMP/package" --site-packages "$SITE" \
            --python-home "$PYTHON_HOME" --media-tools "$RUNNER_TEMP/media-tools" \
            --audio-weight "$RUNNER_TEMP/weights/audio-ast-urban.pt" \
            --video-weight "$RUNNER_TEMP/weights/video-resnet18.pt"
          uv cache clean
      - name: Nonroot offline CPU inference, save and load
        # Both runtime variants execute CPU mode on this GPU-free runner.
        run: >-
          uv run --no-sync python tools/run_container_rehearsal.py
          --package "$RUNNER_TEMP/package"
          --dockerfile containers/Dockerfile.offline
          --output "$RUNNER_TEMP/artifact"
          --backend '${{ matrix.backend }}'
      - name: Upload weight-free runtime image and results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-runtime-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/artifact/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
