			<div class="protocol-detail js-detail-box" id="contentBox_0">
				<div class="content" id="introduce">
					{{if info.id == '2026c40dbb2347fba8b3c9a6294efa5b'}}
					<h3 class="intro-sec-title">大赛简介</h3>
					<p>&emsp;&emsp;近年来，以大模型、具身智能、智能体为代表的人工智能技术加速演进，正以前所未有的深度和广度渗透到经济社会发展中，既为高质量发展注入强劲动能，也对安全治理与可信应用提出了新的更高要求。2025年8月，国务院印发《关于深入实施“人工智能+”行动的意见》，对人工智能赋能千行百业、培育智能经济作出系统部署；2026年《政府工作报告》进一步提出“打造智能经济新形态”，深化拓展“人工智能+”行动，促进新一代智能终端和智能体加快推广，推动重点行业领域人工智能商业化规模化应用，培育智能原生新业态新模式，完善人工智能治理。</p>
					<p>&emsp;&emsp;为深入贯彻落实党中央、国务院决策部署，进一步推动人工智能技术创新发展，促进人工智能与实体经济深度融合，加快构建以大模型为代表的人工智能技术应用落地，在国家互联网信息办公室、公安部指导下，厦门市人民政府主办的第七届中国人工智能大赛正式启动。</p>
					<h3 class="intro-sec-title">奖项设置</h3>
					<p>&emsp;&emsp;根据技术赛参赛队伍客观成绩和案例赛、场景赛专家评审结果进行排名，拟为排名前10%（向上取整）的参赛队伍颁发“中国人工智能大赛”奖项。证书区分A、B级，根据获奖队伍数，每道赛题A级证书数量小于或等于B级证书数量；如同一赛题有一家参赛单位的多个赛队获奖，则根据最好成绩只颁发一个证书。</p>
					{{/if}}
				</div>
			</div>
			<div class="protocol-detail hide js-detail-box" id="contentBox_1">
				<div class="content" id="ruleBox">
					{{if info.id == '2026c40dbb2347fba8b3c9a6294efa5b'}}
					<h3 class="rule-kind">技术赛比赛规则</h3>
					<p><strong>1. 大模型安全攻防赛规则</strong></p>
					<p>&emsp;&emsp;采用调用模型接口的形式进行比赛，选手使用技术手段对指定模型进行改造后向主办方提供openai格式的接口。赛事整体采取“4-1-1-2”的赛程安排，前4天为技术调试适配阶段，选手通过自主优化模型微调策略、搭建安全护栏等技术手段，打磨大模型安全防护方案，部署防护优化后的模型并提供openai格式的调用接口进行连通性测试，测试通过后方可进入正式比赛阶段。第一个1天为平台筹备调整阶段，主办方完成正式赛事数据准备、竞赛环境校验、参数配置等准备工作。第二个1天为正式比赛阶段，主办方将在固定时段对选手提供的接口进行调用测试，正式赛事期间选手仅拥有1次结果提交机会，为保证公平，选手所提供接口单次调用响应最大时长为60s，比赛总时限根据报名情况设定固定时间。第三个2天为核算阶段，主办方核验选手模型使用合规情况与比赛结果，计算比赛成绩。</p>
					<p><strong>2. 大模型幻觉技术赛规则</strong></p>
					<p>&emsp;&emsp;采用调用模型接口的形式进行比赛，选手使用技术手段对指定模型进行改造后向主办方提供openai格式的接口。根据各赛题报名情况排期，采取“4-1-1-2”的比赛安排，即前4天供选手开展技术调试，熟悉竞赛平台使用，使用竞赛平台提供的验证集开展验证和模型策略微调，选手可上传多个结果进行成绩验证；第一个1天为平台调整，准备推送正式比赛数据；第二个1天为正式比赛时间，因采用接口调用的方式获取数据，为保证公平公正，将规定统一时间，选手所提供接口单次调用响应最大时长为60s，为每个赛队设置固定比赛时限，防止出现作弊的情况，在正式比赛过程中，仅为选手提供1次上传结果机会；第三个2天为平台清理与核算，留存全部赛队的平台访问和使用记录，验证模型来源的合规性，并计算成绩。</p>
					<p><strong>3. 多模态内容审核赛规则</strong></p>
					<p>&emsp;&emsp;采用调用模型接口的形式进行比赛。根据各赛题报名情况排期，采取“2-1-1-1”的比赛安排，即前2天供选手开展技术调试，熟悉竞赛平台使用，使用竞赛平台提供的验证集开展验证和模型策略微调，选手可上传多个结果进行成绩验证；第一个1天为平台调整，准备推送正式比赛数据；第二个1天为正式比赛时间，因采用接口调用的方式获取数据，为保证公平公正，将规定统一比赛开始时间，为每个赛队设置4小时的比赛时限，防止出现作弊的情况，在正式比赛过程中，仅为选手提供1次上传结果机会；第三个1天为平台清理，留存全部赛队的平台访问和使用记录，并计算成绩。</p>
					<p><strong>4. AIGC音视频伪造识别赛规则</strong></p>
					<p>&emsp;&emsp;将沿用往届赛题竞赛平台的安全屋形式。大赛组委会针对此类赛题搭建比赛平台，选手根据平台的代码执行要求设定执行方式，将参赛模型代码上传至比赛平台中；比赛平台自动挂载数据，自动执行模型，在离线环境中进行比赛。各项目比赛时长为6天，按照“2-1-2-1”模式划分：其中第一个“2”指参赛队伍在线调试比赛环境，时长为2天；第一个“1”指主办方冻结参赛队伍操作、比赛数据上线，时长为1天；第二个“2”指参赛方运行比赛数据，提交比赛结果，时长为2天；第二个“1”指主办方整理比赛结果，时长为1天。针对每个竞赛项目，各参赛队伍按照格式要求提交不多于3个比赛结果，并明确各个比赛结果对应的代码及运行参数，确保比赛结果可复现。</p>
					<p><strong>5. 智能体安全防护挑战赛规则</strong></p>
					<p>&emsp;&emsp;采用调用智能体API接口的形式进行比赛，选手按照主办方统一接口规范部署参赛智能体系统，提交智能体服务地址、访问凭证等信息，完成平台接口连通适配。赛事整体采取“2-1-1-2”的赛程安排，前2天为技术调试适配阶段，选手自主优化智能体安全防护策略，完善权限访问控制、提示词注入防护、隐私信息保护等安全能力，降低功能误报率，完成接口调试与预测试，适配赛事测评环境后方可进入正式比赛阶段。第一个1天为平台筹备调整阶段，主办方完成正式赛事问答数据集部署、自动化测评环境校验、测试参数配置等准备工作。第二个1天为正式比赛阶段，主办方将在固定时段通过预设安全与恶意样本数据集对选手提交的智能体接口开展自动化黑盒测试，正式赛事期间选手仅拥有1次结果提交机会，选手所提供接口单次调用响应最大时长为60s。最后2天为核算阶段，主办方核验选手参赛合规情况，综合评定智能体风险识别、防范、处置能力及误报表现，计算比赛成绩。</p>
					<h3 class="rule-kind">场景赛比赛规则</h3>
					<p>&emsp;&emsp;具身智能场景赛将采用“实物参与+现场竞技”方式，大赛主办方将根据赛题要求“搭建虚拟/实际场景”，并在比赛前2天现场安排人员进行辅导。参赛方在正式比赛前需将设备运输到比赛场地进行组装、调试、预演等。</p>
					<p>&emsp;&emsp;比赛当天，评审专家将根据考核标准（如机器人动作精准度、场景适配性、应急响应速度）进行评审打分，最后由大赛组委会进行总分核算并形成最终的成绩。</p>
					<h3 class="rule-kind">案例赛比赛规则</h3>
					<p>&emsp;&emsp;参赛选手根据主办方发布的案例赛赛题内容，提供相应赛题的解决方案文稿和演示视频。主办方采取“初选遴选-决赛路演”的形式，组织专家评审团对解决方案文稿内容和路演情况进行客观、公正的评分，确认获奖队伍。评审维度包含技术方案、实施成效、应用价值、应用规模化、应用创新性、商业价值、团队组织、视频效果。</p>
					<h4 class="rule-stage-title">初赛阶段</h4>
					<p>&emsp;&emsp;各参赛队伍按照案例赛题目要求提交解决方案，并制作解决方案文稿和1分钟方案演示视频。将按专家评审得分排名，排名前20%的队伍晋级决赛。</p>
					<h4 class="rule-stage-title">决赛阶段</h4>
					<p>&emsp;&emsp;进入决赛的队伍按照案例赛题目要求，在不改变作品名称和主要功能的基础上持续推进作品迭代升级，制作解决方案文稿和3-5分钟的方案演示视频，用于路演展示及专家答辩。</p>
					<p>&emsp;&emsp;参赛队伍在竞赛期间所提交的材料、数据、解决方案文稿和演示文件等均为原创作品，不得抄袭或剽窃他人成果，如有作弊行为，将被终止参赛资格或取消成绩。</p>
					{{/if}}
